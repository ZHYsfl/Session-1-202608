window:
  width: 480
  height: 360
  fps: 60

robot:
  radius: 14.0
  max_speed: 120.0
  max_angular_speed: 2.5
  control_dt: 0.1

sensors:
  count: 36
  max_range: 180.0
  noise_std_ratio: 0.02
  dropout_ratio: 0.05

episode:
  goal_radius: 28.0
  max_steps: 200
  safe_distance: 38.0

environment:
  max_obstacles: 2
  initial_curriculum_stage: 0
  promotion_success_rate: 0.75

reward:
  progress_scale: 0.05
  goal: 10.0
  collision: -10.0
  time: -0.01
  risk: -0.15
  smooth: -0.02

model:
  ray_channels: [32, 64]
  auxiliary_hidden: 32
  fused_hidden: 128
  mlp_hidden: [128, 128]

ppo:
  total_steps: 1000000
  num_envs: 512
  rollout_steps: 128
  update_epochs: 4
  minibatch_size: 8192
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  seed: 42

evaluation:
  episodes: 500
  seed: 10000

paths:
  cnn_checkpoint: outputs/cnn_ppo.pt
  mlp_checkpoint: outputs/mlp_ppo.pt
  cnn_training_metrics: outputs/cnn_training_metrics.json
  mlp_training_metrics: outputs/mlp_training_metrics.json
  evaluation_metrics: outputs/evaluation_metrics.json
