experiment:
  version: corridor-cnn-v2

window:
  width: 480
  height: 360
  fps: 60

robot:
  radius: 14.0
  max_speed: 120.0
  max_angular_speed: 2.5
  control_dt: 0.1

sensors:
  count: 36
  max_range: 340.0
  noise_std_ratio: 0.02
  dropout_ratio: 0.05

episode:
  goal_radius: 28.0
  max_steps: 200
  safe_distance: 38.0

environment:
  max_obstacles: 12
  max_gates: 6
  initial_curriculum_stage: 0
  previous_stage_ratio: 0.30
  wall_thickness: [4.0, 7.0]
  travel: [315.0, 320.0]
  stages:
    - min_gates: 2
      max_gates: 2
      min_gap: 120.0
      max_gap: 150.0
      curve_amplitude: [58.0, 76.0]
      path_ratio: [1.15, 1.30]
      minimum_steps: 3000000
    - min_gates: 3
      max_gates: 4
      min_gap: 102.0
      max_gap: 132.0
      curve_amplitude: [48.0, 64.0]
      path_ratio: [1.25, 1.50]
      minimum_steps: 5000000
    - min_gates: 4
      max_gates: 6
      min_gap: 90.0
      max_gap: 116.0
      curve_amplitude: [42.0, 58.0]
      path_ratio: [1.45, 1.75]
      minimum_steps: 10000000

reward:
  progress_scale: 0.08
  goal: 15.0
  collision: -12.0
  timeout: -5.0
  time: -0.01
  directional_risk: -0.08
  smooth: -0.015

model:
  ray_channels: [32, 64]
  ray_sectors: 9
  auxiliary_hidden: 32
  fused_hidden: 192
  mlp_hidden: [128, 128]

ppo:
  max_total_steps: 30000000
  num_envs: 512
  rollout_steps: 128
  update_epochs: 4
  minibatch_size: 8192
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_coef: 0.2
  value_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  seed: 42

validation:
  episodes: 256
  num_envs: 256
  interval_updates: 10
  seed: 10000
  consecutive_passes: 3
  promotion_success_rate: 0.85
  promotion_collision_rate: 0.10
  final_success_rate: 0.90
  final_collision_rate: 0.05
  final_timeout_rate: 0.05

evaluation:
  episodes: 500
  seed: 20000

terrain_calibration:
  episodes: 1000
  seed: 30000
  min_path_ratio: 1.15
  max_path_ratio: 1.80
  max_duplicate_rate: 0.02
  direct_max_success_rate: 0.10
  reactive_min_success_rate: 0.30
  reactive_max_success_rate: 0.70

paths:
  cnn_checkpoint: outputs/cnn_ppo_v2_best.pt
  mlp_checkpoint: outputs/mlp_ppo_v2_best.pt
  cnn_latest_checkpoint: outputs/cnn_ppo_v2_latest.pt
  mlp_latest_checkpoint: outputs/mlp_ppo_v2_latest.pt
  cnn_training_metrics: outputs/cnn_training_metrics_v2.json
  mlp_training_metrics: outputs/mlp_training_metrics_v2.json
  evaluation_metrics: outputs/evaluation_metrics_v2.json
  terrain_calibration: outputs/terrain_calibration_v2.json
  terrain_preview: outputs/terrain_preview_v2.png
