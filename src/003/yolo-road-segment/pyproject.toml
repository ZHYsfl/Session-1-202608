[project]
name = "yolo-road-segment"
version = "0.1.0"
description = "Reproducible Ultralytics YOLO26 road instance-segmentation pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-python>=4.10,<5",
    "pyyaml>=6.0.2,<7",
    "tqdm>=4.66,<5",
    "ultralytics==8.4.112",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
